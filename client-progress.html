<title>Client Progress Dashboard</title>
<style>
:root{
  --page:#f9f9f7; --surface:#fcfcfb; --surface-2:#f1f0ec; --surface-3:#e7e6e1;
  --border:rgba(11,11,11,0.10); --border-strong:rgba(11,11,11,0.16);
  --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7;
  --accent:#0f9a75; --accent-ink:#046148; --accent-soft:rgba(15,154,117,0.12);
  --accent-2:#c98500;
  --good:#0a7d0a; --bad:#c22e2e; --warning:#a86a00;
  --cat-1:#2a78d6; --cat-2:#c9581f; --cat-3:#0f9a75; --cat-4:#c98500; --cat-5:#c94f7c; --cat-other:#8b8a85;
  --seq-100:#cde2fb; --seq-250:#86b6ef; --seq-400:#3987e5; --seq-550:#1c5cab; --seq-700:#0d366b;
  --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Cascadia Code", "Consolas", "Roboto Mono", monospace;
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#0d0d0d; --surface:#17181a; --surface-2:#1e2023; --surface-3:#282a2e;
    --border:rgba(255,255,255,0.09); --border-strong:rgba(255,255,255,0.16);
    --text-primary:#f5f5f4; --text-secondary:#c3c2b7; --text-muted:#8b8a85;
    --grid:#2a2c2f; --axis:#3a3c40;
    --accent:#22c99a; --accent-ink:#8be8cf; --accent-soft:rgba(34,201,154,0.14);
    --accent-2:#e0a83a;
    --good:#3fca57; --bad:#f0685f; --warning:#e0a83a;
    --cat-1:#5b9bee; --cat-2:#e88a4f; --cat-3:#22c99a; --cat-4:#e0a83a; --cat-5:#e8749c; --cat-other:#6f7075;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --page:#0d0d0d; --surface:#17181a; --surface-2:#1e2023; --surface-3:#282a2e;
  --border:rgba(255,255,255,0.09); --border-strong:rgba(255,255,255,0.16);
  --text-primary:#f5f5f4; --text-secondary:#c3c2b7; --text-muted:#8b8a85;
  --grid:#2a2c2f; --axis:#3a3c40;
  --accent:#22c99a; --accent-ink:#8be8cf; --accent-soft:rgba(34,201,154,0.14);
  --accent-2:#e0a83a;
  --good:#3fca57; --bad:#f0685f; --warning:#e0a83a;
  --cat-1:#5b9bee; --cat-2:#e88a4f; --cat-3:#22c99a; --cat-4:#e0a83a; --cat-5:#e8749c; --cat-other:#6f7075;
  color-scheme: dark;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--page);color:var(--text-primary);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;}
.wpt{min-height:100vh;background:var(--page);}
.wpt ::selection{background:var(--accent-soft);}
.wpt button{font-family:inherit;}
.wpt input, .wpt select{font-family:inherit;}
.wpt a{color:var(--accent-ink);}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:0.09em;text-transform:uppercase;color:var(--text-muted);}
.h-title{font-weight:800;letter-spacing:-0.02em;color:var(--text-primary);}

.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh;}
.rail{background:var(--surface);border-right:1px solid var(--border);padding:20px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;overflow-y:auto;}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 4px;}
.brand-mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(155deg,var(--accent),var(--accent-ink));display:flex;align-items:center;justify-content:center;flex:none;}
.brand-mark svg{width:17px;height:17px;stroke:#06231b;}
.brand-text .h-title{font-size:15px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px;}
.brand-text .eyebrow{margin-top:2px;}
.nav{display:flex;flex-direction:column;gap:2px;}
.nav-btn{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;border:none;background:transparent;color:var(--text-secondary);font-size:13.5px;font-weight:600;letter-spacing:0.01em;cursor:pointer;text-align:left;width:100%;}
.nav-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;flex:none;}
.nav-btn:hover{background:var(--surface-2);color:var(--text-primary);}
.nav-btn.active{background:var(--accent-soft);color:var(--accent-ink);}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;}
.sync-note{font-size:11px;color:var(--text-muted);line-height:1.5;padding:0 6px;}
.theme-toggle,.refresh-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-secondary);cursor:pointer;font-size:12px;font-weight:600;}
.theme-toggle svg,.refresh-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;}
.theme-toggle:hover,.refresh-btn:hover{border-color:var(--border-strong);}
.refresh-btn.spinning svg{animation:spin 0.9s linear infinite;}
@keyframes spin{ to{ transform:rotate(360deg); } }

.main{padding:26px 32px 60px;max-width:1240px;width:100%;}
.topbar{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
.topbar h1{margin:0;font-size:23px;}
.topbar p{margin:4px 0 0;color:var(--text-secondary);font-size:13px;}

.panel{display:none;}
.panel.active{display:block;}

.grid{display:grid;gap:14px;}
.stat-grid{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;}
.card-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px;flex-wrap:wrap;}
.card-title h3{margin:0;font-size:14.5px;font-weight:800;letter-spacing:-0.01em;}
.card-title .sub{font-size:12px;color:var(--text-muted);}

.stat-tile{display:flex;flex-direction:column;gap:6px;}
.stat-tile .value{font-family:var(--font-mono);font-size:26px;font-weight:600;letter-spacing:-0.01em;}
.stat-tile .value small{font-size:13px;color:var(--text-muted);font-weight:500;margin-left:2px;}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:99px;width:fit-content;font-family:var(--font-mono);}
.chip--good{color:var(--good);background:color-mix(in srgb, var(--good) 14%, transparent);}
.chip--bad{color:var(--bad);background:color-mix(in srgb, var(--bad) 14%, transparent);}
.chip--muted{color:var(--text-muted);background:var(--surface-2);}

.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface-2);color:var(--text-primary);font-size:13px;font-weight:700;cursor:pointer;}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;}
.btn:hover{border-color:var(--text-muted);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#06231b;}

.two-col{grid-template-columns:1.3fr 1fr;align-items:start;}
@media (max-width:920px){ .two-col{grid-template-columns:1fr;} }

table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);font-weight:700;padding:0 10px 8px;border-bottom:1px solid var(--border);}
td{padding:9px 10px;border-bottom:1px solid var(--border);color:var(--text-secondary);}
tr:last-child td{border-bottom:none;}
td.strong{color:var(--text-primary);font-weight:700;}
.table-wrap{overflow-x:auto;}
.table-wrap table{min-width:520px;}

.session-row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--border);cursor:pointer;}
.session-row:last-child{border-bottom:none;}
.session-row:hover{background:var(--surface-2);}
.session-date{width:74px;flex:none;}
.session-date .d{font-family:var(--font-mono);font-weight:700;font-size:14px;}
.session-date .m{font-size:10.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;}
.session-badge{width:9px;height:9px;border-radius:3px;flex:none;}
.session-name{flex:1;min-width:0;}
.session-name .r{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.session-name .x{font-size:11.5px;color:var(--text-muted);}
.session-metrics{display:flex;gap:16px;flex:none;}
.session-metrics div{text-align:right;}
.session-metrics .v{font-family:var(--font-mono);font-weight:700;font-size:13px;}
.session-metrics .l{font-size:9.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;}
.session-detail{display:none;padding:6px 4px 16px 4px;}
.session-detail.open{display:block;}
.ex-block{padding:10px 0;border-top:1px dashed var(--border);}
.ex-block:first-child{border-top:none;}
.ex-block h4{margin:0 0 6px;font-size:13px;font-weight:700;}
.ex-block .target{font-size:11px;color:var(--text-muted);margin-bottom:4px;}
.set-line{display:flex;gap:10px;font-family:var(--font-mono);font-size:12.5px;color:var(--text-secondary);padding:2px 0;}
.set-line .tag{font-family:var(--font-sans);font-size:10px;text-transform:uppercase;letter-spacing:0.04em;color:var(--text-muted);width:56px;flex:none;}

select{background:var(--surface-2);border:1px solid var(--border-strong);color:var(--text-primary);border-radius:7px;padding:8px 10px;font-size:13px;}
select:focus{outline:2px solid var(--accent);outline-offset:1px;}
.select-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.pr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:12px;}
.pr-tile{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;}
.pr-tile .l{font-size:10px;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-muted);font-weight:700;}
.pr-tile .v{font-family:var(--font-mono);font-weight:700;font-size:15px;margin-top:3px;}
.pr-tile .d{font-size:10.5px;color:var(--text-muted);margin-top:2px;}

.chart-wrap{position:relative;}
.chart-svg{width:100%;height:auto;display:block;overflow:visible;}
.chart-tooltip{position:absolute;pointer-events:none;background:var(--surface-3);border:1px solid var(--border-strong);border-radius:7px;padding:7px 10px;font-size:11.5px;line-height:1.5;box-shadow:0 6px 18px rgba(0,0,0,0.18);opacity:0;transition:opacity .1s;z-index:5;white-space:nowrap;}
.chart-tooltip.show{opacity:1;}
.chart-tooltip .tt-title{font-weight:700;color:var(--text-primary);margin-bottom:2px;}
.chart-tooltip .tt-row{display:flex;align-items:center;gap:6px;color:var(--text-secondary);}
.tt-swatch{width:8px;height:8px;border-radius:2px;flex:none;}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:var(--text-secondary);}
.legend-item{display:flex;align-items:center;gap:6px;}
.legend-swatch{width:10px;height:10px;border-radius:3px;flex:none;}

.empty{color:var(--text-muted);font-size:13px;padding:22px 4px;text-align:center;}

.compare-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.compare-head .range-label{font-family:var(--font-mono);font-size:13px;color:var(--text-primary);font-weight:700;}
.compare-head .range-label small{color:var(--text-muted);font-weight:500;margin:0 5px;}
.compare-presets{display:flex;gap:6px;flex-wrap:wrap;}
.compare-presets button{padding:4px 10px;border-radius:99px;border:1px solid var(--border-strong);background:var(--surface-2);color:var(--text-secondary);font-size:11.5px;font-weight:700;cursor:pointer;}
.compare-presets button:hover{border-color:var(--text-muted);}
.compare-presets button.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);}
.range-compare{position:relative;height:28px;margin:6px 4px 4px;}
.range-track{position:absolute;left:0;right:0;top:50%;height:4px;background:var(--surface-3);border-radius:99px;transform:translateY(-50%);}
.range-track-fill{position:absolute;top:50%;height:4px;background:var(--accent);border-radius:99px;transform:translateY(-50%);}
.range-compare input[type=range]{position:absolute;left:0;right:0;top:50%;width:100%;margin:0;transform:translateY(-50%);-webkit-appearance:none;appearance:none;background:transparent;pointer-events:none;}
.range-compare input[type=range]::-webkit-slider-runnable-track{background:transparent;height:4px;}
.range-compare input[type=range]::-moz-range-track{background:transparent;height:4px;}
.range-compare input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:17px;height:17px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);box-shadow:0 1px 4px rgba(0,0,0,0.3);cursor:grab;margin-top:-6.5px;}
.range-compare input[type=range]::-moz-range-thumb{pointer-events:auto;width:17px;height:17px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);box-shadow:0 1px 4px rgba(0,0,0,0.3);cursor:grab;}
.range-ticks{display:flex;justify-content:space-between;margin-top:6px;font-size:10px;color:var(--text-muted);font-family:var(--font-mono);}
.compare-grid{margin-top:16px;}

.cal-wrap{overflow-x:auto;padding-bottom:6px;}
.cal-grid{display:grid;grid-auto-flow:column;gap:3px;}
.cal-col{display:grid;grid-template-rows:repeat(7,11px);gap:3px;}
.cal-cell{width:11px;height:11px;border-radius:2.5px;background:var(--grid);}
.cal-legend{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:11px;color:var(--text-muted);}
.cal-legend .cal-cell{width:10px;height:10px;}

.setup-card{max-width:640px;margin:40px auto;}
.setup-card code{background:var(--surface-2);padding:2px 6px;border-radius:5px;font-family:var(--font-mono);font-size:0.92em;}
.setup-card ol{padding-left:20px;line-height:1.8;}

@media (max-width:820px){
  .shell{grid-template-columns:1fr;}
  .rail{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;padding:10px 12px;overflow-x:auto;z-index:20;}
  .brand{padding:0;}
  .brand-text{display:none;}
  .nav{flex-direction:row;}
  .nav-btn{flex-direction:column;gap:3px;font-size:9.5px;padding:6px 9px;white-space:nowrap;}
  .rail-foot{margin-top:0;flex-direction:row;margin-left:auto;}
  .sync-note{display:none;}
  .main{padding:18px 16px 50px;}
}
</style>
<div class="wpt" id="wpt-root">
  <div class="shell">
    <nav class="rail">
      <div class="brand">
        <div class="brand-mark"><svg viewBox="0 0 24 24" stroke-width="2.4" stroke-linecap="round"><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="8" x2="4" y2="16"/><line x1="2" y1="9.5" x2="2" y2="14.5"/><line x1="20" y1="8" x2="20" y2="16"/><line x1="22" y1="9.5" x2="22" y2="14.5"/></svg></div>
        <div class="brand-text">
          <div class="h-title" id="brandName">Progress</div>
          <div class="eyebrow">Client Dashboard</div>
        </div>
      </div>
      <div class="nav" id="nav">
        <button class="nav-btn" data-tab="overview"><svg viewBox="0 0 20 20" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="2.5" width="6.5" height="6.5" rx="1.3"/><rect x="11" y="2.5" width="6.5" height="6.5" rx="1.3"/><rect x="2.5" y="11" width="6.5" height="6.5" rx="1.3"/><rect x="11" y="11" width="6.5" height="6.5" rx="1.3"/></svg>Overview</button>
        <button class="nav-btn" data-tab="workouts"><svg viewBox="0 0 20 20" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="10" x2="17" y2="10"/><line x1="3" y1="7" x2="3" y2="13"/><line x1="1.5" y1="8" x2="1.5" y2="12"/><line x1="17" y1="7" x2="17" y2="13"/><line x1="18.5" y1="8" x2="18.5" y2="12"/></svg>Workouts</button>
        <button class="nav-btn" data-tab="trends"><svg viewBox="0 0 20 20" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="2.5,15.5 7.5,9.5 11,12.5 17.5,4"/><polyline points="12.5,4 17.5,4 17.5,9"/></svg>Trends</button>
      </div>
      <div class="rail-foot">
        <button class="theme-toggle" id="themeToggle"><svg id="themeIcon" viewBox="0 0 20 20" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="3.6"/><line x1="10" y1="1.6" x2="10" y2="3.4"/><line x1="10" y1="16.6" x2="10" y2="18.4"/><line x1="1.6" y1="10" x2="3.4" y2="10"/><line x1="16.6" y1="10" x2="18.4" y2="10"/><line x1="4.2" y1="4.2" x2="5.4" y2="5.4"/><line x1="14.6" y1="14.6" x2="15.8" y2="15.8"/><line x1="4.2" y1="15.8" x2="5.4" y2="14.6"/><line x1="14.6" y1="5.4" x2="15.8" y2="4.2"/></svg><span id="themeLabel">Theme</span></button>
        <button class="refresh-btn" id="refreshBtn"><svg viewBox="0 0 20 20" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10a6 6 0 0 1 10.2-4.3M16 10a6 6 0 0 1-10.2 4.3"/><polyline points="14.5,3 14.5,6 11.5,6"/><polyline points="5.5,17 5.5,14 8.5,14"/></svg><span>Refresh</span></button>
        <div class="sync-note" id="syncNote">Connecting…</div>
      </div>
    </nav>

    <main class="main">
      <div class="topbar">
        <div>
          <h1 id="pageTitle">Overview</h1>
          <p id="pageSub">Week-on-week progress at a glance.</p>
        </div>
      </div>

      <section class="panel" id="panel-overview"></section>
      <section class="panel" id="panel-workouts"></section>
      <section class="panel" id="panel-trends"></section>
      <section class="panel" id="panel-setup"></section>
    </main>
  </div>
</div>

<script>
(function(){
"use strict";

/* ============================== UTIL ============================== */
function $(sel,root){return (root||document).querySelector(sel);}
function $all(sel,root){return Array.prototype.slice.call((root||document).querySelectorAll(sel));}
function el(tag,attrs,children){
  var e=document.createElement(tag);
  if(attrs) for(var k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.indexOf('on')===0 && typeof attrs[k]==='function') e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }
  (children||[]).forEach(function(c){ if(c==null) return; e.appendChild(c instanceof Node ? c : document.createTextNode(String(c))); });
  return e;
}
function num(s){ if(s===undefined||s===null||s==='') return null; var n=parseFloat(s); return isNaN(n)?null:n; }
function parseLocalDate(s){ var p=s.split('-'); return new Date(parseInt(p[0],10),parseInt(p[1],10)-1,parseInt(p[2],10)); }
function isoDate(d){ var y=d.getFullYear(),m=('0'+(d.getMonth()+1)).slice(-2),day=('0'+d.getDate()).slice(-2); return y+'-'+m+'-'+day; }
function mondayOf(d){ var date=new Date(d); var day=(date.getDay()+6)%7; date.setDate(date.getDate()-day); date.setHours(0,0,0,0); return date; }
function weekKeyOf(dateStr){ return isoDate(mondayOf(parseLocalDate(dateStr))); }
function addDays(d,n){ var r=new Date(d); r.setDate(r.getDate()+n); return r; }
function addDaysISO(iso,n){ return isoDate(addDays(parseLocalDate(iso),n)); }
function fmtDate(s,withYear){ var d=parseLocalDate(s); var opts={day:'numeric',month:'short'}; if(withYear) opts.year='numeric'; return d.toLocaleDateString('en-GB',opts); }
function fmtWeekLabel(s){ var d=parseLocalDate(s); return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'}); }
function fmtNum(n,dec){ if(n==null||isNaN(n)) return '—'; return n.toLocaleString('en-GB',{minimumFractionDigits:dec||0,maximumFractionDigits:dec||0}); }
function round1(n){ return Math.round(n*10)/10; }
function epley1RM(w,r){ return w*(1+r/30); }
function uniq(arr){ return arr.filter(function(v,i){ return arr.indexOf(v)===i; }); }
function sum(arr){ return arr.reduce(function(a,b){return a+b;},0); }
function cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

/* ============================== PROGRAM SHEET PARSER ============================== */
/* Parses the trainer's standard 8-week program-block spreadsheet: weeks run across as
   17-column blocks (exercise name / "Weight (kg):" or "Reps:" row-label / 6 set slots /
   a total / a target-rep-range comment), with training days stacked vertically inside
   each week-block. Built and tested against a real export of this exact template. */
function parseCSVRows(text){
  var rows=[],row=[],field='',inQuotes=false;
  for(var i=0;i<text.length;i++){
    var c=text[i];
    if(inQuotes){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else inQuotes=false; }
      else field+=c;
    } else {
      if(c==='"') inQuotes=true;
      else if(c===','){ row.push(field); field=''; }
      else if(c==='\r'){}
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field+=c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows;
}
function parseDDMY(s){
  var m=(s||'').trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if(!m) return null;
  var dd=parseInt(m[1],10), mm=parseInt(m[2],10), yy=parseInt(m[3],10);
  if(yy<100) yy+=2000;
  return isoDate(new Date(yy,mm-1,dd));
}
function categoryFromDay(dayLabel){
  var s=dayLabel.toUpperCase();
  if(s.indexOf('PUSH')>=0) return 'Push';
  if(s.indexOf('PULL')>=0) return 'Pull';
  if(s.indexOf('LOWER')>=0) return 'Lower';
  if(s.indexOf('UPPER')>=0) return 'Upper';
  if(s.indexOf('ABS')>=0 || s.indexOf('CORE')>=0) return 'Core';
  return 'Other';
}
function parseProgramCSV(text, cycleLabel){
  var rows=parseCSVRows(text.trim());
  var client=null, cycleStart=null, weekCols=[];
  for(var r=0; r<Math.min(rows.length,20); r++){
    for(var c=0; c<rows[r].length; c++){
      var cell=(rows[r][c]||'').toString();
      var m1=cell.match(/TRAINING PLAN FOR:\s*(.+)/i);
      if(m1 && !client) client=m1[1].trim();
      // "DATE:" isn't always its own cell — some sheets have merged header rows
      // where it's embedded mid-string, so this isn't anchored to cell-start.
      if(/DATE:/i.test(cell)){
        for(var c2=c+1; c2<rows[r].length; c2++){
          var iso=parseDDMY(rows[r][c2]);
          if(iso){ cycleStart=iso; break; }
        }
      }
      // Week 1's header cell can also have the first day merged into it
      // ("WEEK 1 TRAINING Mon - PUSH") rather than that day sitting on its own
      // row — capture it here so that first day isn't left unattributed.
      var m2=cell.match(/^WEEK\s*(\d+)\s*TRAINING\s*(.*)/i);
      if(m2) weekCols.push({weekNum:parseInt(m2[1],10), col:c, inlineDay:(m2[2]||'').trim()});
    }
    if(weekCols.length) break;
  }
  if(!weekCols.length || !cycleStart) return {client:client, cycleStart:cycleStart, sets:[], error:'Could not find the week columns or program date in this tab.'};
  weekCols.sort(function(a,b){return a.col-b.col;});
  var weekHeaderRowIdx=rows.findIndex(function(row){ return row.some(function(c){ return /^WEEK\s*\d+/i.test((c||'').toString()); }); });
  var base=weekCols[0].col;
  var sets=[];
  var currentDay=weekCols[0].inlineDay||null;
  var currentCategory=currentDay?categoryFromDay(currentDay):null;
  var i=weekHeaderRowIdx+1;
  while(i<rows.length){
    var row=rows[i];
    var colA=(row[base+0]||'').toString().trim();
    var colLabel=(row[base+4]||'').toString().trim();
    if(!colA && !colLabel){ i++; continue; }
    if(colLabel==='' && colA && !/^total/i.test(colA)){ currentDay=colA; currentCategory=categoryFromDay(colA); i++; continue; }
    if(/^total/i.test(colA)){ i++; continue; }
    if(colLabel==='Sets:'){ i++; continue; }
    if(colLabel==='Weight (kg):'){
      var exerciseName=colA;
      var weightRow=row, repsRow=rows[i+1]||[];
      var targetRepRange=(weightRow[base+12]||'').toString().trim();
      weekCols.forEach(function(wk){
        var weekDate=addDaysISO(cycleStart,(wk.weekNum-1)*7);
        for(var s=0; s<6; s++){
          var wCell=(weightRow[wk.col+5+s]||'').toString().trim();
          var rCell=(repsRow[wk.col+5+s]||'').toString().trim();
          if(!wCell || !rCell) continue;
          var weight=parseFloat(wCell.replace(/kg/i,'').trim());
          var reps=parseFloat(rCell.trim());
          if(isNaN(weight) || isNaN(reps) || weight<=0 || reps<=0) continue;
          sets.push({
            id: cycleLabel+'|'+weekDate+'|'+currentDay+'|'+exerciseName+'|'+(s+1),
            date: weekDate, durationSec: null, routine: currentDay, category: currentCategory,
            exercise: exerciseName, baseWeight: null, setType: 'Standard Set',
            weight: weight, reps: reps, rir: null, setDurationSec: null, distShortM: null, distLongKm: null,
            targetRepRange: targetRepRange, cycle: cycleLabel, weekNum: wk.weekNum
          });
        }
      });
      i+=2;
      continue;
    }
    i++;
  }
  return {client:client, cycleStart:cycleStart, sets:sets, error:null};
}

function buildSessions(){
  var map={};
  state.sets.forEach(function(s){
    var key=s.date+'|'+s.routine;
    if(!map[key]) map[key]={date:s.date, routine:s.routine, category:s.category, sets:[], exOrder:[]};
    map[key].sets.push(s);
    if(map[key].exOrder.indexOf(s.exercise)<0) map[key].exOrder.push(s.exercise);
  });
  var sessions=Object.keys(map).map(function(k){
    var sess=map[k];
    var volume=sum(sess.sets.map(function(s){return s.weight*s.reps;}));
    var exByName={};
    sess.exOrder.forEach(function(ex){ exByName[ex]=sess.sets.filter(function(s){return s.exercise===ex;}); });
    return { key:k, date:sess.date, routine:sess.routine, category:sess.category, exOrder:sess.exOrder, exByName:exByName, totalSets:sess.sets.length, volume:volume };
  });
  sessions.sort(function(a,b){ return a.date<b.date?1:a.date>b.date?-1:0; });
  return sessions;
}
var CAT_COLOR_VAR={Push:'--cat-1',Pull:'--cat-2',Lower:'--cat-3',Upper:'--cat-4',Core:'--cat-5',Other:'--cat-other'};
function buildWeeks(sessions){
  var byWeek={};
  sessions.forEach(function(s){
    var wk=weekKeyOf(s.date);
    if(!byWeek[wk]) byWeek[wk]={week:wk, sessions:[], volume:0, sets:0, catVolume:{}};
    byWeek[wk].sessions.push(s);
    byWeek[wk].volume+=s.volume;
    byWeek[wk].sets+=s.totalSets;
    byWeek[wk].catVolume[s.category]=(byWeek[wk].catVolume[s.category]||0)+s.volume;
  });
  var weeks=Object.keys(byWeek).map(function(k){return byWeek[k];});
  weeks.sort(function(a,b){ return a.week<b.week?-1:1; });
  return weeks;
}
function exerciseSeries(exercise){
  var rows=state.sets.filter(function(s){ return s.exercise===exercise; });
  var byDate={};
  rows.forEach(function(s){ if(!byDate[s.date]) byDate[s.date]=[]; byDate[s.date].push(s); });
  var dates=Object.keys(byDate).sort();
  var points=dates.map(function(d){
    var daySets=byDate[d];
    var top=daySets.reduce(function(a,b){return b.weight>a.weight?b:a;});
    var best1rm=Math.max.apply(null, daySets.map(function(s){return epley1RM(s.weight,s.reps);}));
    return {date:d, weight:top.weight, reps:top.reps, e1rm:round1(best1rm)};
  });
  return {mode:'weight', points:points};
}

/* ============================== DELTA CHIP ============================== */
function deltaChip(curr,prev,opts){
  opts=opts||{};
  if(curr==null || prev==null) return el('span',{class:'chip chip--muted'},['— no prior data']);
  var diff=curr-prev;
  var dir = Math.abs(diff)<(opts.epsilon||0.001) ? 'flat' : (diff>0?'up':'down');
  var good = dir==='flat'? null : (opts.goodDirection==='down' ? dir==='down' : dir==='up');
  var cls = (dir==='flat' || opts.neutral) ? 'chip--muted' : (good?'chip--good':'chip--bad');
  var arrow = dir==='up'?'▲':dir==='down'?'▼':'▬';
  var dec = opts.decimals||0;
  var txt=(diff>0?'+':'')+diff.toFixed(dec)+(opts.unit||'');
  if(prev!==0 && opts.showPct!==false){
    var pct=(diff/Math.abs(prev))*100;
    txt+=' ('+(pct>0?'+':'')+pct.toFixed(0)+'%)';
  }
  return el('span',{class:'chip '+cls},[arrow+' '+txt]);
}

function renderCalendar(host, sessions){
  host.innerHTML='';
  var byDate={};
  sessions.forEach(function(s){ byDate[s.date]=(byDate[s.date]||0)+s.volume; });
  var maxVol=Math.max.apply(null, Object.keys(byDate).map(function(k){return byDate[k];}).concat([1]));
  var end=mondayOf(new Date()); end=addDays(end,6);
  var weeksToShow=26;
  var start=addDays(end,-7*weeksToShow+1);
  start=mondayOf(start);
  var grid=el('div',{class:'cal-grid'});
  var cur=new Date(start);
  while(cur<=end){
    var col=el('div',{class:'cal-col'});
    for(var d=0; d<7; d++){
      var ds=isoDate(cur);
      var v=byDate[ds]||0;
      var step = v<=0?0 : v<maxVol*0.15?1 : v<maxVol*0.35?2 : v<maxVol*0.6?3 : v<maxVol*0.85?4 : 5;
      var colors=[cssVar('--grid'),cssVar('--seq-100'),cssVar('--seq-250'),cssVar('--seq-400'),cssVar('--seq-550'),cssVar('--seq-700')];
      var cell=el('div',{class:'cal-cell',title:ds+(v?' · '+fmtNum(Math.round(v))+' kg volume':''),style:'background:'+colors[step]});
      col.appendChild(cell);
      cur=addDays(cur,1);
    }
    grid.appendChild(col);
  }
  host.appendChild(grid);
}

function buildWeekCompareControl(weeksAsc){
  var n=weeksAsc.length;
  var wrap=el('div');
  var head=el('div',{class:'compare-head'});
  var label=el('div',{class:'range-label'});
  head.appendChild(label);
  var presets=el('div',{class:'compare-presets'});
  var presetDefs=[['All',0,n-1]];
  if(n>4) presetDefs.push(['Last 4',n-4,n-1]);
  if(n>8) presetDefs.push(['Last 8',n-8,n-1]);
  if(n>12) presetDefs.push(['Last 12',n-12,n-1]);
  var presetBtns=[];
  presetDefs.forEach(function(p){
    var btn=el('button',{type:'button'},[p[0]]);
    btn.addEventListener('click',function(){
      state.weekCompareFrom=p[1]; state.weekCompareTo=p[2];
      renderOverview();
    });
    presets.appendChild(btn);
    presetBtns.push({btn:btn,from:p[1],to:p[2]});
  });
  head.appendChild(presets);
  wrap.appendChild(head);

  var slider=el('div',{class:'range-compare'});
  var track=el('div',{class:'range-track'});
  var fill=el('div',{class:'range-track-fill'});
  slider.appendChild(track); slider.appendChild(fill);
  var fromInput=el('input',{type:'range',min:'0',max:String(n-1),step:'1',value:String(state.weekCompareFrom),style:'z-index:3'});
  var toInput=el('input',{type:'range',min:'0',max:String(n-1),step:'1',value:String(state.weekCompareTo),style:'z-index:4'});
  slider.appendChild(fromInput); slider.appendChild(toInput);
  wrap.appendChild(slider);

  var ticks=el('div',{class:'range-ticks'},[fmtWeekLabel(weeksAsc[0].week), n>1?fmtWeekLabel(weeksAsc[n-1].week):'']);
  wrap.appendChild(ticks);

  function updateVisual(){
    var f=parseInt(fromInput.value,10), t=parseInt(toInput.value,10);
    if(f>t){ if(document.activeElement===fromInput){ t=f; toInput.value=String(t); } else { f=t; fromInput.value=String(f); } }
    var pctF=n>1? (f/(n-1))*100 : 0;
    var pctT=n>1? (t/(n-1))*100 : 100;
    fill.style.left=pctF+'%'; fill.style.right=(100-pctT)+'%';
    label.innerHTML='';
    label.appendChild(document.createTextNode(fmtWeekLabel(weeksAsc[f].week)));
    label.appendChild(el('small',{},['→']));
    label.appendChild(document.createTextNode(fmtWeekLabel(weeksAsc[t].week)));
    label.appendChild(el('small',{},['('+(t-f+1)+' week'+(t-f+1===1?'':'s')+')']));
    presetBtns.forEach(function(p){ p.btn.classList.toggle('active', p.from===f && p.to===t); });
  }
  updateVisual();

  fromInput.addEventListener('pointerdown',function(){ fromInput.style.zIndex='5'; toInput.style.zIndex='3'; });
  toInput.addEventListener('pointerdown',function(){ toInput.style.zIndex='5'; fromInput.style.zIndex='3'; });
  fromInput.addEventListener('input', updateVisual);
  toInput.addEventListener('input', updateVisual);
  function commit(){
    var f=parseInt(fromInput.value,10), t=parseInt(toInput.value,10);
    if(f>t){ var tmp=f; f=t; t=tmp; }
    state.weekCompareFrom=f; state.weekCompareTo=t;
    renderOverview();
  }
  fromInput.addEventListener('change', commit);
  toInput.addEventListener('change', commit);

  return wrap;
}
function cumulativeThroughWeek(weeks, idx){
  var slice=weeks.slice(0, idx+1);
  return {
    sessions: sum(slice.map(function(w){return w.sessions.length;})),
    volume: sum(slice.map(function(w){return w.volume;})),
    sets: sum(slice.map(function(w){return w.sets;}))
  };
}
function buildWeekCompareSummary(weeks, fromIdx, toIdx){
  // Cumulative running totals (everything logged from the very first week up to
  // each point), not a single week's snapshot — so the delta reads as the total
  // increase between the two selected points, e.g. "start" to "current".
  var a=cumulativeThroughWeek(weeks, fromIdx);
  var b=cumulativeThroughWeek(weeks, toIdx);
  var wrap=el('div',{class:'compare-grid'});
  var grid=el('div',{class:'grid stat-grid'});
  function ctile(label,aVal,bVal,opts){
    opts=opts||{};
    var card=el('div',{class:'card stat-tile'});
    card.appendChild(el('div',{class:'eyebrow'},[label]));
    var valueNode=el('div',{class:'value'},[bVal!=null?fmtNum(bVal,opts.decimals||0):'—']);
    if(opts.suffix && bVal!=null) valueNode.appendChild(el('small',{},[opts.suffix]));
    card.appendChild(valueNode);
    card.appendChild(deltaChip(bVal,aVal,opts));
    return card;
  }
  grid.appendChild(ctile('Total sessions', a.sessions, b.sessions, {neutral:true,showPct:false}));
  grid.appendChild(ctile('Total volume (kg)', Math.round(a.volume), Math.round(b.volume), {neutral:true,showPct:false}));
  grid.appendChild(ctile('Total sets', a.sets, b.sets, {neutral:true,showPct:false}));
  wrap.appendChild(grid);
  return wrap;
}

var SHEET_ID = getQueryParam('sheet');
var TABS = (getQueryParam('tabs')||'Training').split(',').map(function(s){return s.trim();}).filter(Boolean);

function loadData(isRefresh){
  if(!SHEET_ID){ renderSetupState(); return; }
  var refreshBtn=$('#refreshBtn');
  if(isRefresh) refreshBtn.classList.add('spinning');
  Promise.all(TABS.map(function(tab){
    return fetchTabCSV(SHEET_ID, tab)
      .then(function(text){ return parseProgramCSV(text, tab); })
      .catch(function(err){ return {client:null, sets:[], error:err.message, cycle:tab}; });
  })).then(function(results){
    var allSets=[], client=null, errors=[];
    results.forEach(function(r){
      if(r.client && !client) client=r.client;
      allSets=allSets.concat(r.sets);
      if(r.error) errors.push(r.cycle+': '+r.error);
    });
    if(!client && errors.length===TABS.length){
      renderSetupState('Could not read this sheet: '+errors.join('; ')+'. Check it\'s shared as "Anyone with the link — Viewer" and the tab name is correct.');
      if(isRefresh) refreshBtn.classList.remove('spinning');
      return;
    }
    allSets.sort(function(a,b){ return a.date<b.date?-1:a.date>b.date?1:0; });
    state.sets=allSets; state.client=client; state.fetchErrors=errors; state.lastFetchAt=new Date().toISOString();
    if(!isRefresh) setActiveTab('overview');
    else { $all('.panel').forEach(function(p){}); renderTab(state.activeTab); }
    updateSyncNote();
    if(isRefresh) refreshBtn.classList.remove('spinning');
  });
}
$('#refreshBtn').addEventListener('click',function(){ loadData(true); });

setActiveTab('overview');
loadData(false);
})();
</script>
